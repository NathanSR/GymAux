<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GymAux - Offline</title>
    <meta name="theme-color" content="#09090b">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #09090b;
            color: #fafafa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
        }
        .container {
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .icon-box {
            position: relative;
            margin-bottom: 24px;
        }
        .icon-glow {
            position: absolute;
            inset: -8px;
            background: rgba(163, 230, 53, 0.15);
            border-radius: 24px;
            filter: blur(16px);
            z-index: 0;
        }
        .icon-card {
            position: relative;
            z-index: 1;
            width: 80px;
            height: 80px;
            border-radius: 24px;
            background: #18181b;
            border: 1px solid #27272a;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .icon-svg {
            width: 38px;
            height: 38px;
            stroke: #a3e635;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            color: #ffffff;
        }
        p {
            font-size: 14px;
            color: #a1a1aa;
            line-height: 1.5;
            margin-bottom: 32px;
        }
        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }
        button, a {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.15s ease, background-color 0.15s ease;
        }
        button:active, a:active {
            transform: scale(0.98);
        }
        .btn-retry {
            background: #18181b;
            border: 1px solid #27272a;
            color: #f4f4f5;
        }
        .btn-retry:hover {
            background: #27272a;
        }
        .btn-home {
            background: #a3e635;
            color: #09090b;
            border: none;
            box-shadow: 0 10px 15px -3px rgba(163, 230, 53, 0.2);
        }
        .btn-home:hover {
            background: #bef264;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-box">
            <div class="icon-glow"></div>
            <div class="icon-card">
                <svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                    <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
                    <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
                    <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
                    <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
                    <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                    <line x1="12" y1="20" x2="12.01" y2="20"></line>
                </svg>
            </div>
        </div>

        <h1 id="txt-title">Você está offline</h1>
        <p id="txt-desc">Sem conexão com a internet no momento. Seus treinos e dados locais salvos continuam disponíveis.</p>

        <div class="actions">
            <button class="btn-retry" onclick="window.location.reload()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                <span id="txt-retry">Tentar novamente</span>
            </button>
            <a href="/" class="btn-home">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span id="txt-home">Ir para o App</span>
            </a>
        </div>
    </div>

    <script>
        // Detecção de idioma nativa (PT, EN, ES)
        const translations = {
            pt: {
                title: "Você está offline",
                desc: "Sem conexão com a internet no momento. Seus treinos e dados locais salvos continuam disponíveis.",
                retry: "Tentar novamente",
                home: "Ir para o App"
            },
            en: {
                title: "You are offline",
                desc: "No internet connection right now. Your saved local workouts and data remain accessible.",
                retry: "Try again",
                home: "Go to App"
            },
            es: {
                title: "Estás sin conexión",
                desc: "Sin conexión a internet en este momento. Tus entrenamientos y datos locales guardados siguen disponibles.",
                retry: "Intentar de nuevo",
                home: "Ir a la App"
            }
        };

        const lang = (navigator.language || 'pt').slice(0, 2).toLowerCase();
        const t = translations[lang] || translations.pt;

        document.getElementById('txt-title').textContent = t.title;
        document.getElementById('txt-desc').textContent = t.desc;
        document.getElementById('txt-retry').textContent = t.retry;
        document.getElementById('txt-home').textContent = t.home;
    </script>
</body>
</html>
